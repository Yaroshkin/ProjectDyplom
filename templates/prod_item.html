<div class="col-md-3 mb-3">
            <div class="card">
                <img src="{{ product_image.image.url }}" class="card-img-top" alt="{{ product.name }}" >
                <div class="card-body">
                    <h5 class="card-title">{{ product_image.product.name }}</h5>
                    <p class="card-text">{{ product_image.product.description }}</p>
                    <p class="card-text">${{ product_image.product.price }} UAH</p>
                    <a href="" class="btn btn-outline-primary">Додати у кошик</a>
                </div>
            </div>
</div>
